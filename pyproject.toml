[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-interlock"
version = "0.1.0"
description = "Explainable policy enforcement for simulated safety-critical operations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "hypothesis>=6.100,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<3",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
